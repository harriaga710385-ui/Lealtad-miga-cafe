<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3E2418">
<title>Miga&amp;Café · Tarjeta de sellos</title>
<style>
:root{--cafe:#3E2418;--medio:#8A5A36;--crema:#FBF5EA;--beige:#E8D5B7;--beige2:#F3E6D0}
*{box-sizing:border-box;margin:0}
body{background:var(--crema);color:var(--cafe);font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:0 20px 36px;text-align:center}
.banner{display:block;width:calc(100% + 40px);max-width:none;margin:0 -20px;height:auto}
h2{font-family:Georgia,"Times New Roman",serif;font-size:2rem;line-height:1.2;margin:28px 0 12px}
.intro{font-size:1.15rem;max-width:34ch;margin:0 auto}
.tarjeta{background:var(--beige2);border:3px solid var(--beige);border-radius:22px;padding:20px 12px 16px;margin:26px 0 30px}
.tarjeta h3{font-size:1.05rem;font-weight:700;margin-bottom:14px}
.sellos{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px;list-style:none;padding:0}
.sellos svg{display:block;width:100%;height:auto}
.sellos li{position:relative}
.sellos .n{position:absolute;left:0;right:12%;top:36%;font-weight:700;font-size:1rem;color:var(--medio)}
.btn{display:block;width:100%;background:var(--cafe);color:var(--crema);font:700 1.35rem "Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;text-decoration:none;padding:20px 16px;border-radius:18px;box-shadow:0 5px 0 #1F110A}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1F110A}
.btn:focus-visible{outline:4px solid var(--medio);outline-offset:3px}
.nota{font-size:.95rem;color:var(--medio);margin:26px auto 0;max-width:34ch}
</style>
</head>
